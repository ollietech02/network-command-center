name: Report a problem
description: Something in the dashboard or the installer is broken, wrong or confusing.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! Reports are **public**, so please leave out passwords,
        email addresses, your Tailscale address and anything else private.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see? An error message, a wrong number, a button that did nothing...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen?
      description: The steps that lead to the problem, if you know them.
      placeholder: |
        1. Open the Devices tab
        2. Click ...
  - type: dropdown
    id: system
    attributes:
      label: Computer the dashboard runs on
      options:
        - Linux
        - Windows
        - Raspberry Pi
        - Other
    validations:
      required: true
  - type: input
    id: system_detail
    attributes:
      label: Which version of that system?
      placeholder: e.g. Ubuntu 24.04, Windows 11, Raspberry Pi OS (bookworm)
  - type: dropdown
    id: part
    attributes:
      label: Where is the problem?
      options:
        - The installer
        - The dashboard
        - Ad blocker (Pi-hole / AdGuard Home)
        - Phone access (Tailscale) or web access
        - Alerts (phone or email)
        - Not sure
  - type: input
    id: version
    attributes:
      label: Dashboard version
      description: Shown next to the name at the top of the dashboard.
      placeholder: e.g. 1.0
  - type: textarea
    id: logs
    attributes:
      label: Log lines (optional)
      description: |
        Linux: `./ncc logs 50`. Windows: `ncc logs 50` in the dashboard folder. Read them first and
        remove anything private.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you send
      options:
        - label: I removed passwords, email addresses and other private details.
          required: true
